name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  quality:
    name: Quality (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        if: matrix.node-version == 22
        run: pnpm lint

      - name: Format check
        if: matrix.node-version == 22
        run: pnpm format:check

      - name: Test with coverage
        run: |
          # coverage-v8 uses node:inspector/promises (Node 19+), so run coverage only on Node 20+
          if [ "${{ matrix.node-version }}" = "18" ]; then
            pnpm test
          else
            pnpm test:coverage
          fi

      - name: Upload coverage
        if: matrix.node-version == 22
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Build
        run: pnpm build

      - name: Check package size
        run: |
          SIZE=$(du -sk dist/ | cut -f1)
          echo "📦 Package size: ${SIZE}KB"
          if [ "$SIZE" -gt 512 ]; then
            echo "::warning::Package size (${SIZE}KB) exceeds 512KB"
          fi

  publish-dry-run:
    name: Publish dry run
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Pack and report
        run: |
          OUTPUT=$(npm pack --dry-run 2>&1)
          echo "$OUTPUT"
          {
            echo '### 📦 Publish dry run'
            echo
            echo '| Metric | Value |'
            echo '|--------|-------|'
            echo "$OUTPUT" | grep -E 'package size|unpacked size|total files' \
              | sed -E 's/npm notice //; s/^([^:]*):[[:space:]]*(.*)$/| \1 | \2 |/'
            echo
            echo "Commit: \`${GITHUB_SHA::7}\`"
          } >> "$GITHUB_STEP_SUMMARY"
